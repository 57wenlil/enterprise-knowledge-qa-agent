[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-qa-agent"
version = "1.0.0"
description = "Evidence-grounded enterprise knowledge QA agent for campus project"
requires-python = ">=3.11"

[project.optional-dependencies]
llm = ["httpx>=0.27,<1"]
graph = ["langgraph>=1.0,<2"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
